<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--header section-->
    <header>
<h1>Contact Us</h1>
    <p>We would love to hear from you! Please fill in the form below.</p>
</header>

<!--contact form section-->
<section>
    <form>
     <label for="name">Name:</label>
     <input type="text" id="name" name="name" placeholder="Enter your name" required>
     <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>
    <label for="phone number">Phone number:</label>
    <input type="tel" id="phone number" name="phone" placeholder="Enter your phone number" required>

    <label for="subject">Subject:</label>
    <select id="subject" name="subject">
    <option value="general">General Question</option>
     <option value="support">Support</option>  
     <option value="feedback">Feedback</option> 
     <option value="appointment"> Book Appointment</option>
    </select>
    <label for="message">Message:</label>
    <textarea id="message" name="message" row="5" placeholder="Type your message here..." required></textarea>

    <button type="submit">Submit</button>
    </form>
</section>

<!--schedule tabel section-->
<section>
    <h2>Available Appointment Times</h2>
    <table>
        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Available</th>
        </th>
        <tr>
            <td>Monday</td>
            <td>9:00am - 10:00am </td>
            <td>open</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>10:00am - 11:00am </td>
            <td>open</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>11:00am - 12:00pm </td>
            <td>closed</td>
        </tr>
        <tr>
            <td>Thursday</td>
            <td>13:00pm - 14:00pm </td>
            <td>open</td>
         </tr>
         <tr>
            <td>Friday</td>
            <td>14:00pm - 15:00pm </td>
            <td>open</td>
         </tr>    
        
    </table>
</section>    
</body>
</html>
